apiVersion: batch/v1
kind: Job

metadata:
  name: arngupta-cifar10-job

spec:
  template:
    metadata:
      labels:
        app: arngupta-cifar10-job

    spec:
      restartPolicy: Never

      containers:
      - name: arngupta-container
        image: pytorch/pytorch
        command: ["sh", "-c", "pip install matplotlib && python /data/cifar10train.py"]

        resources:
          limits:
            memory: 4Gi
            cpu: "4"
            nvidia.com/gpu: "1"
          requests:
            memory: 2Gi
            cpu: "2"
            nvidia.com/gpu: "1"

        volumeMounts:
        - mountPath: /data
          name: task3-storage

      volumes:
      - name: task3-storage
        persistentVolumeClaim:
          claimName: arngupta-task3
