apiVersion: apps/v1
kind: Deployment
metadata:
  name: arngupta-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arngupta-task3
  template:
    metadata:
      labels:
        app: arngupta-task3
    spec:
      containers:
      - name: arngupta-container
        image: pytorch/pytorch
        command: ["sh", "-c", "sleep infinity"]
        resources:
          limits:
            memory: 4Gi
            cpu: "4"
            nvidia.com/gpu: "1"
          requests:
            memory: 2Gi
            cpu: "2"
            nvidia.com/gpu: "1"
        volumeMounts:
        - mountPath: /data
          name: task3-storage
      volumes:
      - name: task3-storage
        persistentVolumeClaim:
          claimName: arngupta-task3
